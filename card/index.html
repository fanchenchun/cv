<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Jack Fan | 老范 · 數位名片</title>
    <meta name="description" content="Jack Fan | 老范 — 專利顧問 | Patent Consultant。20 年智財實務 x AI應用。掃描 NFC 即可存入通訊錄。">
    <meta name="theme-color" content="#2c3e50">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f5f7fa;
            --text-main: #1a2533;
            --text-sub: #5a6a7a;
            --card-bg: rgba(255, 255, 255, 0.82);
            --border: rgba(52, 152, 219, 0.18);
            --shadow: 0 8px 32px rgba(44, 62, 80, 0.12);
            --radius: 20px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            max-width: 420px;
            width: 100%;
            padding: 52px 32px 40px;
            text-align: center;
            animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Avatar / Icon */
        .avatar {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 4px 16px rgba(52, 152, 219, 0.3);
        }

        .avatar-initials {
            color: white;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -1px;
        }

        /* Name */
        .name-zh {
            font-size: 1.85rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 2px;
            line-height: 1.2;
        }

        .name-en {
            font-size: 1.1rem;
            font-weight: 300;
            color: var(--text-sub);
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* Divider */
        .divider {
            width: 48px;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), rgba(52, 152, 219, 0.2));
            border-radius: 2px;
            margin: 16px auto;
        }

        /* Title & Tagline */
        .title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        .tagline {
            margin-top: 10px;
            font-size: 0.92rem;
            color: var(--text-sub);
            font-weight: 400;
            line-height: 1.5;
            letter-spacing: 0.3px;
        }

        /* CTA Buttons */
        .actions {
            margin-top: 36px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 20px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: 0.2px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, #34495e 100%);
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(44, 62, 80, 0.30), 0 2px 6px rgba(44, 62, 80, 0.18);
        }

        .btn-primary:hover {
            box-shadow: 0 8px 28px rgba(44, 62, 80, 0.42), 0 3px 10px rgba(44, 62, 80, 0.22);
            opacity: 0.96;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.9);
            color: var(--primary);
            border: 1.5px solid rgba(44, 62, 80, 0.18);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            box-shadow: 0 5px 14px rgba(44, 62, 80, 0.16);
            transform: translateY(-1px);
        }

        .btn-line {
            background: #06C755;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(6, 199, 85, 0.30);
        }

        .btn-line:hover {
            box-shadow: 0 8px 24px rgba(6, 199, 85, 0.44);
            opacity: 0.96;
            transform: translateY(-1px);
        }

        .btn-ig {
            background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(220, 39, 67, 0.30);
        }

        .btn-ig:hover {
            box-shadow: 0 8px 24px rgba(220, 39, 67, 0.44);
            opacity: 0.96;
            transform: translateY(-1px);
        }

        .btn-email {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(231, 76, 60, 0.30);
        }

        .btn-email:hover {
            box-shadow: 0 8px 24px rgba(231, 76, 60, 0.44);
            opacity: 0.96;
            transform: translateY(-1px);
        }

        .btn-linkedin {
            background: linear-gradient(135deg, #0077b5 0%, #005582 100%);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(0, 119, 181, 0.30);
        }

        .btn-linkedin:hover {
            box-shadow: 0 8px 24px rgba(0, 119, 181, 0.44);
            opacity: 0.96;
            transform: translateY(-1px);
        }

        /* Core Tags */
        .tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 14px;
        }

        .tag {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--accent);
            background: rgba(52, 152, 219, 0.10);
            border: 1px solid rgba(52, 152, 219, 0.28);
            border-radius: 50px;
            padding: 4px 12px;
            letter-spacing: 0.4px;
            transition: background 0.18s ease, color 0.18s ease;
        }

        .tag:hover {
            background: rgba(52, 152, 219, 0.18);
        }

        .btn-accent {
            background: linear-gradient(135deg, var(--accent) 0%, #2980b9 100%);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(52, 152, 219, 0.3);
        }

        .btn-accent:hover {
            box-shadow: 0 8px 24px rgba(52, 152, 219, 0.44);
            opacity: 0.96;
            transform: translateY(-1px);
        }

        .btn-row {
            display: flex;
            gap: 12px;
        }

        .btn-row .btn {
            flex: 1;
            font-size: 0.85rem;
            padding: 16px 8px;
            gap: 6px;
        }

        .btn-row .btn-emoji {
            font-size: 0.95rem;
        }

        .btn-emoji {
            font-size: 1.1rem;
            line-height: 1;
        }

        /* QR Code */
        .qr-block {
            margin-top: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .qr-block img {
            width: 150px;
            height: 150px;
            border-radius: 12px;
            border: 1px solid rgba(44, 62, 80, 0.12);
            box-shadow: 0 2px 10px rgba(44, 62, 80, 0.08);
            display: block;
        }

        .qr-hint {
            font-size: 0.68rem;
            color: rgba(90, 106, 122, 0.5);
            letter-spacing: 0.4px;
            font-weight: 300;
        }

        /* Footer */
        .card-footer {
            margin-top: 16px;
            font-size: 0.7rem;
            color: rgba(90, 106, 122, 0.45);
            letter-spacing: 0.4px;
            font-weight: 300;
        }
    </style>
</head>
