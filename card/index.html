<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Jack Fan | 老范 · 數位名片</title>
    <meta name="description" content="Jack Fan | 老范 — 專利顧問 | Patent Consultant。20 年智財實務 x AI應用。掃描 NFC 即可存入通訊錄。">
    <meta name="theme-color" content="#2c3e50">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f5f7fa;
            --text-main: #1a2533;
            --text-sub: #5a6a7a;
            --card-bg: rgba(255, 255, 255, 0.82);
            --border: rgba(52, 152, 219, 0.18);
            --shadow: 0 8px 32px rgba(44, 62, 80, 0.12);
            --radius: 20px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            max-width: 420px;
            width: 100%;
            padding: 52px 32px 40px;
            text-align: center;
            animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Avatar / Icon */
        .avatar {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 4px 16px rgba(52, 152, 219, 0.3);
        }

        .avatar-initials {
            color: white;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -1px;
        }

        /* Name */
        .name-zh {
            font-size: 1.85rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 2px;
            line-height: 1.2;
        }

        .name-en {
            font-size: 1.1rem;
            font-weight: 300;
            color: var(--text-sub);
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* Divider */
        .divider {
            width: 48px;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), rgba(52, 152, 219, 0.2));
            border-radius: 2px;
            margin: 16px auto;
        }

        /* Title & Tagline */
        .title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        .tagline {
            margin-top: 10px;
            font-size: 0.92rem;
            color: var(--text-sub);
            font-weight: 400;
            line-height: 1.5;
            letter-spacing: 0.3px;
        }

        /* CTA Buttons */
        .actions {
            margin-top: 36px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 20px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: 0.2px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, #34495e 100%);
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(44, 62, 80, 0.30), 0 2px 6px rgba(44, 62, 80, 0.18);
        }

        .btn-primary:hover {
            box-shadow: 0 8px 28px rgba(44, 62, 80, 0.42), 0 3px 10px rgba(44, 62, 80, 0.22);
            opacity: 0.96;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.9);
            color: var(--primary);
            border: 1.5px solid rgba(44, 62, 80, 0.18);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            box-shadow: 0 5px 14px rgba(44, 62, 80, 0.16);
            transform: translateY(-1px);
        }

        .btn-line {
            background: #06C755;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(6, 199, 85, 0.30);
        }

        .btn-line:hover {
            box-shadow: 0 8px 24px rgba(6, 199, 85, 0.44);
            opacity: 0.96;
            transform: translateY(-1px);
        }

        .btn-ig {
            background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(220, 39, 67, 0.30);
        }

        .btn-ig:hover {
            box-shadow: 0 8px 24px rgba(220, 39, 67, 0.44);
            opacity: 0.96;
            transform: translateY(-1px);
        }

        .btn-email {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(231, 76, 60, 0.30);
        }

        .btn-email:hover {
            box-shadow: 0 8px 24px rgba(231, 76, 60, 0.44);
            opacity: 0.96;
            transform: translateY(-1px);
        }

        .btn-linkedin {
            background: linear-gradient(135deg, #0077b5 0%, #005582 100%);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(0, 119, 181, 0.30);
        }

        .btn-linkedin:hover {
            box-shadow: 0 8px 24px rgba(0, 119, 181, 0.44);
            opacity: 0.96;
            transform: translateY(-1px);
        }

        /* Core Tags */
        .tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 14px;
        }

        .tag {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--accent);
            background: rgba(52, 152, 219, 0.10);
            border: 1px solid rgba(52, 152, 219, 0.28);
            border-radius: 50px;
            padding: 4px 12px;
            letter-spacing: 0.4px;
            transition: background 0.18s ease, color 0.18s ease;
        }

        .tag:hover {
            background: rgba(52, 152, 219, 0.18);
        }

        .btn-accent {
            background: linear-gradient(135deg, var(--accent) 0%, #2980b9 100%);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(52, 152, 219, 0.3);
        }

        .btn-accent:hover {
            box-shadow: 0 8px 24px rgba(52, 152, 219, 0.44);
            opacity: 0.96;
            transform: translateY(-1px);
        }

        .btn-row {
            display: flex;
            gap: 12px;
        }

        .btn-row .btn {
            flex: 1;
            font-size: 0.85rem;
            padding: 16px 8px;
            gap: 6px;
        }

        .btn-row .btn-emoji {
            font-size: 0.95rem;
        }

        .btn-emoji {
            font-size: 1.1rem;
            line-height: 1;
        }

        /* QR Code */
        .qr-block {
            margin-top: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .qr-block img {
            width: 150px;
            height: 150px;
            border-radius: 12px;
            border: 1px solid rgba(44, 62, 80, 0.12);
            box-shadow: 0 2px 10px rgba(44, 62, 80, 0.08);
            display: block;
        }

        .qr-hint {
            font-size: 0.68rem;
            color: rgba(90, 106, 122, 0.5);
            letter-spacing: 0.4px;
            font-weight: 300;
        }

        /* Footer */
        .card-footer {
            margin-top: 16px;
            font-size: 0.7rem;
            color: rgba(90, 106, 122, 0.45);
            letter-spacing: 0.4px;
            font-weight: 300;
        }

        /* ── Toast 訊息 ── */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(30, 40, 55, 0.93);
            color: #fff;
            padding: 13px 22px;
            border-radius: 50px;
            font-size: 0.88rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.22);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
            white-space: nowrap;
            text-align: center;
            max-width: 90vw;
            white-space: pre-line;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── LINE Overlay ── */
        .line-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 20, 35, 0.72);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .line-overlay.visible {
            display: flex;
        }
        .line-overlay-box {
            background: #fff;
            border-radius: 20px;
            padding: 36px 28px 28px;
            max-width: 340px;
            width: 100%;
            text-align: center;
            box-shadow: 0 16px 48px rgba(0,0,0,0.25);
            animation: fadeUp 0.35s cubic-bezier(0.22,1,0.36,1) both;
        }
        .line-overlay-icon {
            font-size: 2.8rem;
            margin-bottom: 14px;
            line-height: 1;
        }
        .line-overlay-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #1a2533;
            margin-bottom: 12px;
            letter-spacing: 0.3px;
        }
        .line-overlay-body {
            font-size: 0.9rem;
            color: #4a5a6a;
            line-height: 1.7;
            margin-bottom: 24px;
        }
        .line-overlay-body strong {
            color: #06C755;
        }
        .line-overlay-close {
            display: inline-block;
            padding: 12px 32px;
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: #fff;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
            letter-spacing: 0.3px;
        }
        .line-overlay-close:hover {
            opacity: 0.88;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Avatar -->
        <div class="avatar">
            <span class="avatar-initials">范</span>
        </div>

        <!-- Identity -->
        <div class="name-zh">Jack Fan</div>
        <div class="name-en">老范</div>

        <div class="divider"></div>

        <div class="title">專利顧問 | Patent Consultant</div>
        <div class="tagline">20 年智財實務 × AI 應用</div>

        <!-- Core Advantage Tags -->
        <div class="tags">
            <span class="tag">#SEP談判</span>
            <span class="tag">#專利AI化</span>
            <span class="tag">#權利金管理</span>
        </div>

        <!-- CTA Buttons -->
        <div class="actions">
            <button id="btn-vcf" class="btn btn-primary" type="button" onclick="handleVcfDownload()">
                <span class="btn-emoji">💾</span>存入通訊錄
            </button>
            <a id="btn-cv" class="btn btn-secondary" href="../">
                <span class="btn-emoji">📄</span>查看詳細資歷
            </a>
            <a id="btn-lab" class="btn btn-accent" href="../#ai-lab">
                <span class="btn-emoji">🧪</span>智財 AI 實驗室
            </a>
            <div class="btn-row">
                <a id="btn-email" class="btn btn-email" href="mailto:fanchenchun@gmail.com">
                    <span class="btn-emoji">✉️</span>寄信給我
                </a>
                <a id="btn-linkedin" class="btn btn-linkedin" href="https://www.linkedin.com/in/jack-fan-048b03228/" target="_blank" rel="noopener">
                    <span class="btn-emoji">💼</span>LinkedIn
                </a>
            </div>
            <div class="btn-row">
                <a id="btn-line" class="btn btn-line" href="https://line.me/ti/p/8HqDvmmHcE" target="_blank" rel="noopener">
                    <span class="btn-emoji">💬</span>加 LINE 好友
                </a>
                <a id="btn-ig" class="btn btn-ig" href="https://www.instagram.com/jackfan54?igsh=MW83Y2J3ZzV3ZTg2aA%3D%3D&utm_source=qr" target="_blank" rel="noopener">
                    <span class="btn-emoji">📸</span>加 IG 好友
                </a>
            </div>
        </div>

        <!-- QR Code -->
        <div class="qr-block">
            <img src="qr-code.png" alt="掃描 QR Code 以快速交換名片">
            <span class="qr-hint">掃描上方 QR Code 快速交換名片</span>
        </div>

        <div class="card-footer">© 2026 Jack Fan | IP AI Lab</div>
    </div>

    <!-- LINE 限制提示 Overlay -->
    <div class="line-overlay" id="line-overlay" role="dialog" aria-modal="true" aria-label="LINE 瀏覽器提示">
        <div class="line-overlay-box">
            <div class="line-overlay-icon">💬</div>
            <div class="line-overlay-title">請在外部瀏覽器開啟</div>
            <div class="line-overlay-body">
                因 LINE 限制下載功能，<br>
                請點擊右上角 <strong>「⋯」</strong> 並選擇<br>
                <strong>「在瀏覽器中開啟」</strong>，<br>即可正常存入通訊錄。
            </div>
            <button class="line-overlay-close" onclick="closeLineOverlay()">我知道了</button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        /* ────────────────────────────────
           環境偵測
        ──────────────────────────────── */
        function isLineBrowser() {
            return /Line\/[\d.]+/i.test(navigator.userAgent);
        }
        function isAndroid() {
            return /Android/i.test(navigator.userAgent);
        }
        function isIOS() {
            return /iP(hone|ad|od)/i.test(navigator.userAgent);
        }

        /* ────────────────────────────────
           Toast 工具
        ──────────────────────────────── */
        let toastTimer = null;
        function showToast(msg, duration) {
            duration = duration || 3000;
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () {
                el.classList.remove('show');
            }, duration);
        }

        /* ────────────────────────────────
           LINE Overlay
        ──────────────────────────────── */
        function showLineOverlay() {
            document.getElementById('line-overlay').classList.add('visible');
        }
        function closeLineOverlay() {
            document.getElementById('line-overlay').classList.remove('visible');
        }
        // 點擊遮罩背景也可關閉
        document.getElementById('line-overlay').addEventListener('click', function (e) {
            if (e.target === this) closeLineOverlay();
        });

        /* ────────────────────────────────
           vCard 內容
        ──────────────────────────────── */
        var VCARD_CONTENT = [
            'BEGIN:VCARD',
            'VERSION:3.0',
            'FN:Jack Fan',
            'N:Fan;Jack;;;',
            'NICKNAME:老范',
            'ORG:IP AI Lab',
            'TITLE:專利顧問 | Patent Consultant',
            'TEL;TYPE=CELL:',
            'EMAIL;TYPE=WORK:fanchenchun@gmail.com',
            'URL:https://fanchenchun.github.io/cv/',
            'NOTE:20 年智財實務 × AI 應用 | SEP談判 | 專利AI化 | 權利金管理',
            'END:VCARD'
        ].join('\r\n');

        /* ────────────────────────────────
           主下載邏輯
        ──────────────────────────────── */
        function handleVcfDownload() {
            // 1. LINE 瀏覽器：顯示引導 Overlay，不執行下載
            if (isLineBrowser()) {
                showLineOverlay();
                return;
            }

            // 2. iOS（Safari）：直接用 data URI，iOS 會詢問加入通訊錄
            if (isIOS()) {
                showToast('正在生成通訊錄檔案...');
                var dataUri = 'data:text/vcard;charset=utf-8,' + encodeURIComponent(VCARD_CONTENT);
                window.location.href = dataUri;
                return;
            }

            // 3. Android 及其他桌面瀏覽器：Blob + Object URL（相容性最強）
            try {
                var toastMsg = '正在生成通訊錄檔案...';
                if (isAndroid()) {
                    toastMsg = '正在生成通訊錄檔案...\n請於下載完成後點擊檔案開啟。';
                }
                showToast(toastMsg, 4500);

                var blob = new Blob([VCARD_CONTENT], { type: 'text/vcard;charset=utf-8' });
                var url = window.URL.createObjectURL(blob);
                var link = document.createElement('a');
                link.href = url;
                link.download = 'JackFan.vcf';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(function () { window.URL.revokeObjectURL(url); }, 100);
            } catch (err) {
                // Fallback：若 Blob 不支援，改用靜態 vcf 檔案
                showToast('正在下載...');
                var fallback = document.createElement('a');
                fallback.href = 'jack_fan.vcf';
                fallback.download = 'JackFan.vcf';
                document.body.appendChild(fallback);
                fallback.click();
                document.body.removeChild(fallback);
            }
        }
    </script>
</body>
</html>
